name: Tests
on:
  pull_request:               # every pull request is tested before it can be merged
  workflow_call:              # lets deploy.yml run these tests before it deploys

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: pytest --cov
      - name: Show the coverage report on the summary page of this run
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
